name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code #make sure to run in virtual
        uses: actions/checkout@v4
      - name: Set up JDK 21 #set up JDK Version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
#      - name: Set up Maven #maven to download
#        uses: stCarolas/setup-maven@v4.5
#        with:
#          maven-version: 3.9.9
#      - name: Cache Maven dependencies
#        uses: actions/cache@v3
#        with:
#          path: ~/.m2/repository
#          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
#          restore-keys: |
#            ${{ runner.os }}-maven-
      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2
        with:
          # Optional: do not specify to match Chrome's version
          chromedriver-version: '114.0.5735.90'
          # Optional: if your chrome binary name is different
          chromeapp: chrome
      - name: Run TestNG Tests with Offline Dependencies
        run: |
          CLASSPATH="libraries/selenium-server-4.28.1.jar:libraries/testng-7.10.2.jar:libraries/log4j-api-2.24.3.jar:libraries/log4j-core-2.24.3.jar:libraries/slf4j-api-1.7.36.jar:libraries/jcommander-1.72.jar:libraries/bsh-2.0b6.jar:out/production/hybrid-framework-OrangeHRM/"
          java org.testng.TestNG resources/runAllTestcases.xml
        # Thay `resources/runAllTestcases.xml` bằng đường dẫn chính xác đến file XML.

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-output/
